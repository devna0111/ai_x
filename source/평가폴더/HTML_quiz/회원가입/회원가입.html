<html lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        
        <title>회원가입</title>
        <script>
                function chk() {
                        if (!frm.name.value) {
                                alert('이름 기입하세요.');
                                frm.name.focus();
                                return false;
                        } else if (frm.name.value.length < 2) {
                                alert('이름은 무조건 두 글자 이상입니다.');
                                frm.name.focus();
                                return false;
                        } else if (frm.id.value.length < 4) {
                                alert('id는 4글자 이상 기입하셔야합니다.');
                                frm.id.focus();
                                return false; 
                        } else if (!frm.pw.value) {
                                alert('비밀번호를 입력하세요');
                                frm.pw.focus();
                                return false;
                        } else if (frm.pw.value != frm.pwChk.value) {
                                alert('비밀번호 확인란을 정확히 입력하세요');
                                frm.pwChk.focus();
                                return false;
                        } else if (!frm.tel.value) {
                                alert('번호 입력해라');
                                frm.tel.focus();
                                return false;
                        } else if (!frm.email.value) {
                                alert('이메일 입력해라');
                                frm.email.focus();
                                return false; 
                        } alert('정상작동합니다.')
                }
        </script>
        <style>
                span {
                        color: red;
                }

                footer {
                        border-top: 2px solid #bbbbbb;
                        text-align: center;
                        font-size: 13px
                }

                div td {
                        text-align: center;
                }
        </style>

</head>
<body>

        <header>
                <center><h1>회원가입</h1></center>
        </header>
        <div id="contents">
                <form onsubmit="return chk()" name="frm">
                        <fieldset>
                                <legend>필수입력</legend>
                                <table>
                                        <tbody><tr>
                                                <td>이름<span>*</span></td>
                                                <td>
                                                        <input type="text" name="name" id="name" placeholder="이름은 2글자 이상" autofocus="autofocus">
                                                </td>
                                        </tr>
                                        <tr>
                                                <td>아이디<span>*</span></td>
                                                <td><input type="text" name="id" placeholder="ID는 4글자 이상"></td>
                                        </tr>
                                        <tr>
                                                <td>비밀번호<span>*</span></td>
                                                <td><input type="password" name="pw"></td>
                                        </tr>
                                        <tr>
                                                <td>비번확인<span>*</span></td>
                                                <td><input type="password" name="pwChk"></td>
                                        </tr>
                                        <tr>
                                                <td>전화<span>*</span></td>
                                                <td>
                                                        <input type="tel" name="tel" placeholder="xx-xxx-xxxx/000-0000-0000" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}" title="전화번호 형식은 000-0000-0000나 00-000-0000나 00-0000-0000">
                                                </td>
                                        </tr>
                                        <tr>
                                                <td>이메일<span>*</span></td>
                                                <td>
                                                        <input type="email" name="email" placeholder="id@domain.com 또는 co.kr" pattern="[a-zA-Zㄱ-ㅎ가-힣]{1}[0-9a-zA-Zㄱ-ㅎ가-힣]{1,}@[0-9a-zA-Z]{1,}(\.[0-9a-zA-Z]{1,}){1,2}" title="이메일 형식은 id@domain.com 또는 .co.kr 등">
                                                </td>
                                        </tr>
                                </tbody></table>
                        </fieldset>
                        <fieldset>
                                <legend>추가입력사항</legend>
                                <table>
                                        <tbody><tr>
                                                <td>결혼 유무</td>
                                                <td>
                                                        <input type="radio" name="wedding" value="did">기혼
                                                        <input type="radio" name="wedding" value="yet">미혼
                                                </td>
                                        </tr>
                                        <tr>
                                                <td>자식</td>
                                                <td>
                                                        <input type="checkbox" name="son" value="son">아들
                                                        <input type="checkbox" name="son" value="dau">딸
                                                </td>
                                        </tr>
                                        <tr>
                                                <td>지역</td>
                                                <td>
                                                        <select name="region">
                                                                <option>서울</option>
                                                                <option>충남</option>
                                                                <option>전북</option>
                                                                <option>경기</option>
                                                                <option>충북</option>
                                                                <option>경남</option>
                                                                <option>강원</option>
                                                                <option>전남</option>
                                                                <option>경북</option>
                                                        </select>
                                                </td>
                                        </tr>
                                </tbody></table>
                        </fieldset>
                        <p>
                                </p><center><input type="submit" value="입력완료"> <input type="reset" value="입력취소"></center>
                        <p></p>
                </form>
        </div>
        <footer>
                <p>
                        서울시 서대문구 신촌로 141 은하빌딩 203호<br>

                </p>
        </footer>


</body></html>
