    <script>
        let cnt=0; // 누적 횟수
        let score=0; // 유효한 점수의 합
        let ok_cnt=0; // 점수를 제대로 입력한 횟수
        let no_cnt = 0; // 점수를 잘못 입력한 횟수수
        while(confirm('누적할래?')){
                cnt +=1;
                key_numb = parseFloat(prompt('누적할 점수?'));
                if(isNaN(key_numb)){
                    no_cnt +=1
                }else{
                    score += key_numb;
                    ok_cnt +=1;
                }
        }
        document.write(cnt,'번 입력','<br>');
        document.write('누적 점수 : ',score,'<br>');
        document.write('점수를 제대로 입력한 횟수 : ',ok_cnt,'<br>');
        document.write('점수를 잘못 입력한 횟수 : ',no_cnt,'<br>');
        
    </script></head><body>0번 입력<br>누적 점수 : 0<br>점수를 제대로 입력한 횟수 : 0<br>점수를 잘못 입력한 횟수 : 0<br>
