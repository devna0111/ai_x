    <style>
        table {width:280px; height: 100px; margin: 10px auto;} h3{text-align:center;}
        td{border: 1px solid gray;}
    </style>
    <script>
        var colors = ['red', 'orange', 'yellow', 'green', 'blue','navy','purple', 'white']
        window.onload = ()=>{
            var colors = ['red', 'orange', 'yellow', 'green', 'blue','navy','purple']
            var tds = document.querySelectorAll('td');
            for(idx=0;idx<tds.length;idx++){
                tds[idx].style.backgroundColor = colors[idx];
            }
        }
        function bgcolorChange(i){
            var bgcolor = ['red', 'orange', 'yellow', 'green', 'blue','navy','purple', 'white']
            document.body.style.backgroundColor = bgcolor[i];
            }
    </script>
</head>
<body style="background-color: white;">
    <center><h1>quiz1 : 마우스를 올리면 바탕화면도 해당색상으로</h1></center><table> 
        <tbody><tr onmouseout="bgcolorChange(7)"><!-- tr에서 마우스를 빼면 바탕화면이 하얀색-->
            <td onmouseover="bgcolorChange(0)" style="background-color: red;"></td>
            <td onmouseover="bgcolorChange(1)" style="background-color: orange;"></td>
            <td onmouseover="bgcolorChange(2)" style="background-color: yellow;"></td>
            <td onmouseover="bgcolorChange(3)" style="background-color: green;"></td>
            <td onmouseover="bgcolorChange(4)" style="background-color: blue;"></td>
            <td onmouseover="bgcolorChange(5)" style="background-color: navy;"></td>
            <td onmouseover="bgcolorChange(6)" style="background-color: purple;"></td>
        </tr>
    </tbody></table>
