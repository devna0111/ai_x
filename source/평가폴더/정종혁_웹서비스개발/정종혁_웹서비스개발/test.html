<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>test</title>
    <link href="test.css" rel="stylesheet" type="text/css" />
    <script>
        /*def chk() : */
        function chk() {
            // submit이 안일어나는 조건 : name.value.length < 2, title.value가 빈 스트링
            if (!frm.name.value.length) {
                alert('이름을 반드시 기입하세요.');
                frm.name_id.focus();
                return false; // submit 이벤트 제한
            } else if (frm.id.value.length < 2) {
                alert('아이디는 2글자 이상 필요합니다');
                frm.id.focus()
                return false;
            } else if (!frm.email.value.length) {
                alert('이메일을 입력하세요');
                frm.email.focus()
                return false;
            } else if (frm.전화.value.length < 9) {
                alert('전화번호는 9자리 이상입니다');
                frm.전화.focus()
                return false;
            } else if (frm.생년월일.value.length < 6) {
                alert('생년월일 6자리를 입력하세요');
                frm.생년월일.focus()
                return false;
            } else if (frm.생년월일.value.length < 6) {
                alert('생년월일 6자리를 입력하세요');
                frm.생년월일.focus()
                return false;
            }
        }
    </script>
</head>
<body>
    <div id="wrap">
        <nav>
            <div id="nav_left">
                <ul>
                    <li><a href="#" id="LOGO"><img src="LOGO.png" height="24" width="85"/></a></li>
                    <li><a href="#">참여하기</a></li>
                    <li><a href="#">개설하기</a></li>
                    <li><a href="#">검색하기</a></li>
                </ul> 
            </div>
            <div id="nav_right">
                <ul>
                    <li><a href="#">고객센터</a></li>
                    <li><a href="#">로그아웃</a></li>
                    <li><a href="#">홍길동님</a></li>
                </ul>
            </div>
        </nav>
        <div id="content">
            <div id="title"><a href="#">마이 페이지</a></div>
            <div id="lnb">
                <ul>
                    <li><a href="#">나의여행</a></li>
                    <li><a href="#">참여여행</a></li>
                    <li><a href="#">관심여행</a></li>
                    <li><a href="#">개인정보변경</a></li>
                    <li><a href="#">비밀번호변경</a></li>
                </ul>
            </div>
            <div id="my_content">
                <div id="sub_title"><a href="#">개인정보변경</a></div>
                <div id="modify">
                    <form name="frm" onsubmit="return chk()">
                        <table>
                            <tr><td><label for="name_id">이름</label></td><td><input type="text" name="name" id="name_id" /></td></tr>
                            <tr><td><label for="id">아이디</label></td><td><input type="text" name="id" id="id"/></td></tr>
                            <tr><td><label for="email">이메일</label></td><td><input type="text" name="email" id="email" pattern="[0-9a-zA-Zㄱ-ㅎ가-힣]{1,}@[0-9a-zA-Zㄱ-ㅎ가-힣]{1,}\.[0-9a-zA-Zㄱ-ㅎ가-힣]{1,}\.{0,1}[0-9a-zA-Zㄱ-ㅎ가-힣]{1,}"  title="000@000.com 형식 모두 맞추세요" /></td></tr>
                            <tr><td><label for="전화">전화</label></td><td><input type="text" name="전화" id="전화" placeholder="전화번호는 -표시 없이 기입하세요"/></td></tr>
                            <tr><td><label for="생년월일">생년월일</label></td><td><input type="text" name="생년월일" id="생년월일" placeholder="생년월일은 6자리입니다."/></td></tr>
                            <tr><td colspan="2"><center><input type="submit" name="submit" value="저장" /><input type="reset" name="reset" value="초기화" /></center></td></tr>
                        </table>
                    </form>
                </div>
            </div>
        </div>
        <footer>
            footer
        </footer>
    </div>

</body>
</html>
