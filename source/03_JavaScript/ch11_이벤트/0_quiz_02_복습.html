    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8">
    <title>복습quiz02_</title>
    <style>
        ul{overflow: hidden;}
        li{float: left; list-style: none; margin: 3px;}
    </style>
    <script>
        var overImg = ['img/0over.jpg', 'img/1over.jpg', 'img/2over.jpg', 'img/3over.jpg'];
        var outImg = ['img/0out.jpg', 'img/1out.jpg', 'img/2out.jpg', 'img/3out.jpg'];
        var imgs;
        window.onload = ()=>{
            imgs = document.getElementsByTagName('img');
            for(let i in imgs){ // 지금 실행하는 값이 아니라면 let을 사용해야 정상작동한다.
                imgs[i].onmouseover = function(){
                    this.src=overImg[i];
                };
                imgs[i].onmouseout = function(){
                    this.src = outImg[i];
                };
            }
        };

    </script>
    </head>
    <body>
    <ul>
        <li><a href="#"><img src="img/0out.jpg" /></a></li>
        <li><a href="#"><img src="img/1out.jpg" /></a></li>
        <li><a href="#"><img src="img/2out.jpg" /></a></li>
        <li><a href="#"><img src="img/3out.jpg" /></a></li>
    </ul>
    </body>
    </html>
