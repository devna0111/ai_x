<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>이벤트 강제 발생</title>
    <style>
        
    </style>
    <script>
        window.onload = function(){
            var btnA = document.getElementById('btnA');
            var btnB = document.querySelector('button#btnB');
            var countA = document.getElementById('countA');
            var countB = document.querySelector('span#countB');
            btnA.onclick = ()=>{
                countA.innerHTML = Number(countA.innerHTML) + 1;
                // btnB를 강제 클릭 이벤트 발생
                btnB.onclick();
            };
            btnB.onclick = ()=>{
                countB.innerHTML = Number(countB.innerHTML) + 1; 
            }
        };
    </script>
</head>
<body>
    <button id = 'btnA'>BUTTON A</button> &nbsp;&nbsp;
    <button id = 'btnB'>BUTTON B</button>
    <h1>BUTTON A 클릭 횟수 : <span id ='countA'>0</span></h1>
    <h1>BUTTON B 클릭 횟수 : <span id ='countB'>0</span></h1>
</body>
</html>
