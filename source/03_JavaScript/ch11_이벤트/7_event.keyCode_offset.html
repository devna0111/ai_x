<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>keyCode와 offset</title>
    <style>
        img{display: none;position: absolute;}
    </style>
    <script>
        var span;
        window.onload = ()=>{ 
            span = document.querySelector('span') ;
        };
        window.onkeyup = ()=>{
            // 입력된 키보드를 span태그에 출력
            let key = event.keyCode;
            // span.innerHTML = key;
            if((key>=96) && (key<=105)){
                span.innerHTML = '우측 숫자 키보드 ' +(key - 96)+'을/를 눌렀구나'
            }else if((key>=48)&&(key<=57)){
                span.innerHTML = '위쪽 숫자 키보드 ' +(key - 48)+'을/를 눌렀구나'
            }else if((key>=65)&&(key<=90)){
                span.innerHTML = '알파벳 키보드 ' +String.fromCodePoint(key) +'을/를 눌렀구나'
            }
            // 우측 숫자키 : 0(96) ~ 9(105);
            // 위쪽 숫자키 : 0(48) ~ 9(57);
        };
        window.onclick = ()=>{
            // 클릭한 좌표를 span태그에 출력
            span.innerHTML ='브라우저 기준 좌표 : ' + event.offsetX + ' , ' + event.offsetY + '<br>'; // 브라우저 기준의 좌표
            span.innerHTML += '스크린 기준 좌표 : ' + event.screenX + ' , ' + event.screenY; // 스크린 기준의 좌표 => 쓸 일이 있나?
            let img = document.querySelector('img');
            img.style.display = 'block'
            img.style.left = event.offsetX-33.5 +'px';
            img.style.top = event.offsetY-27.5 + 'px';
            img.style.zIndex=-1;

        };
    </script>
</head>
<body>
    <span></span>
    <img src="img/car.gif">
</body>
</html>
