<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>INDEX</title>
    <style>
    </style>
    <script>
        window.onload = ()=>{
            // 문서객체추가방법 1 : 1) h1태그 생성 2) textNode 생성 3) textNode를 h1에 연결 4) h1을 바디에 연결
            var h1 = document.createElement('h1'); 
            var textNode = document.createTextNode('추가함');
            h1.appendChild(textNode);
            document.body.appendChild(h1);
            // 문서객체추가방법 2 : 1)img태그 생성 2)img태그 속성변경 3)img를 body에 연결
            var img = document.createElement('img');
            img.setAttribute('src','img/red.jpg');
            img.setAttribute('alt','추가된이미지');
            document.body.append(img);
            // 문서객체추가방법 3 : innerHTML 이용
            document.body.innerHTML += '<h1>innerHTML로 추가</h1>'
        };
    </script>
</head>
<body>
    <h1>TEXT NODE</h1>
    <img src="img/orange.jpg" alt="오렌지" />
</body>
</html>
