<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>문서객체가져오기_final</title>
    <style>
        
    </style>
    <script>
        window.onload = ()=>{
            color = ['red','orange'];
            var header = document.querySelector('h1.header'); // 해당 선택자 중 첫번째 것을 선택. 선택방법 5
            header.innerHTML ='첫번째만';
            var headers = document.querySelectorAll('h1.header'); // 해당 선택자 모두를 선택. 선택방법 6
            for(let idx in headers){
                // headers[idx].style.backgroundColor = color[idx];
                headers[idx].style = 'background-color :' + color[idx];
            };
            // for(let data of headers){
            //     data.style.backgroundColor = 'orange';
            // };
            var input = document.querySelector('body input[type="text"]');
            input.style = 'width:500px'
            input.value = '즐거운 주말 보내세요. 월요일에 꼭 봐요'
        };
    </script>
</head>
<body>
    <h1 class="header">HEADER1</h1>
    <h1 class="header">HEADER2</h1>
    <input type="text" name ='param'>
</body>
</html>
