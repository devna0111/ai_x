<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        const chk = ()=>{
            var id = document.getElementsByName('id')[0]; // getElements**** => 배열형태 객체 반환, 개수가 1개(idx=0)인 배열형태 객체
            var pw = document.getElementsByName('pw')[0];
            var gender = document.getElementsByName('gender'); // 배열객체
            if(!id.value.trim()){
                alert('ID를 입력하세요');
                id.focus();
            }else if(!pw.value.trim()){
                alert('PW를 입력하세요');
                pw.focus()
            }else if(!gender[0].checked && !gender[1].checked){
                alert('성별을 선택하세요')
            }else if(gender[0].checked){
                alert('남자 ' + id.value +'님 비번은 ' + pw.value);
            }else if(gender[1].checked){
                alert('여자 ' + id.value +'님 비번은 ' + pw.value)
            }
            return false
        };
    </script>
</head>
<body>
    <form onsubmit="return chk()">
        <p>ID &nbsp; <input type="text" name='id'></p>
        <p>PW <input type="password" name='pw'></p>
        <p>
            성별 
            <input type="radio" name='gender' value="m">남자
            <input type="radio" name='gender' value="f">여자
        </p>
        <p><input type="submit" value="로그인하기"></p>
    </form>

</body>
</html>
