    <title>quiz</title>
    <style>
        body{background-image : url("img/img01.png");background-size:100%;color:#FFFF00;font-size:1.5em;font-weight:bold;}
    </style>
    <script>
        // 사용할 변수 우선 선언
        let time_flow = 0; // 시간 경과를 저장할 변수
        let colors = ['#FFFF00', '#00FFBE', 'white']; // 글자색 부여할 배열
        let images = [
            'url(img/img01.png)',
            'url(img/img02.png)',
            'url(img/img03.png)',
        ];
        document.writeln(new Date().toLocaleString());
        let timerID = setInterval(()=>{
            document.body.innerHTML = new Date().toLocaleString();
            time_flow++;
            document.body.innerHTML += '<p>' + time_flow +'초 지남</p>';
            document.body.style.backgroundImage = images[time_flow%images.length];
            document.body.style.color = colors[time_flow%colors.length];
        },1000);
        setTimeout(()=>{clearInterval(timerID)},10000);
    </script>
</head>
