    <title>내부함수</title>
    <style>
        
    </style>
    <script> /* A가 만든 부분 */

        function pythagotas(width, height){
             // 내부함수 : 함수내의 함수
            function square(x){ // 내부 함수 사용 이유 : 충돌을 피하고자
                    return x*x;
        };
            return Math.sqrt(square(width) + square(height));
        };
        </script>
    <script> /* B가 만든 부분 */
        function square(width, height, hypotenuse){
            if(width*width + height*height == hypotenuse*hypotenuse){
                return true;
            }else{return false;
            };
        };
    </script>

<body>
    <script>
        alert('빗변의 길이는 '+ pythagotas(3,4));
        alert('직각삼각형 여부 : ' + square(3,4,5));
    </script>
