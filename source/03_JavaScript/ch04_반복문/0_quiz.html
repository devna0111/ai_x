<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width+ height=device-height+ initial-scale=1.0+ minimum-scale=1.0+ maximum-scale=1.0" />
    <title>quiz</title>
    <style>
        
    </style>
    
</head>
<body>
    <div id="answer"></div>
    <script>
        let cnt=0; // 누적 횟수
        let score=0; // 유효한 점수의 합
        let ok_cnt=0; // 점수를 제대로 입력한 횟수
        let no_cnt = 0; // 점수를 잘못 입력한 횟수
        while(confirm('누적할래?')){
                cnt +=1;
                key_ = prompt('누적할 점수?'); // key_numb : 0 ~ 100점 사이 실수만 제대로 입력한 경우 ! null 주의
                key_numb=Number(key_);
                if(!key_|| !key_.trim() ||isNaN(key_numb)||key_numb>100||key_numb<0){
                    no_cnt +=1
                }else{
                    score += key_numb;
                    ok_cnt +=1;
                }
        }
        result = cnt+'번 입력'+'<br>'+'누적 점수 : '+score+'<br>'+'점수를 제대로 입력한 횟수 : '+ok_cnt+'<br>'+'점수를 잘못 입력한 횟수 : '+no_cnt+'<br>'
        var answer = document.getElementById('answer');
        answer.innerHTML = result;
        // document.write(cnt+'번 입력'+'<br>');
        // document.write('누적 점수 : '+score+'<br>');
        // document.write('점수를 제대로 입력한 횟수 : '+ok_cnt+'<br>');
        // document.write('점수를 잘못 입력한 횟수 : '+no_cnt+'<br>');
        // document.write(typeof(null)) => null : object 타입
    </script>
</body>
</html>
