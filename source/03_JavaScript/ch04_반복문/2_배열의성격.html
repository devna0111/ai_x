<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>배열의 성격</title>
    <script>
        // 자바스크립트에서의 배열의 크기가 가변적. 자료의 집합.
        var arr = [2, 4, '홍길동', true, function(){alert(1)}, [1,2]];
        document.write('arr의 타입 ',typeof(arr), ' 값 : ',arr, '<br>')
        document.write('arr 방의 개수 ',arr.length,'<br>')
        document.write(0 + ' : ' + arr[0] + '<br>')
        document.write(1 + ' : ' + arr[1] + '<br>')
        document.write(2 + ' : ' + arr[2] + '<br>')
        document.write(3 + ' : ' + arr[3] + '<br>')
        document.write(4 + ' : ' + arr[4] + '<br>')
        document.write(5 + ' : ' + arr[5] + '<br>')
        arr.push('6번 인덱스의 값 추가'); // python list.append()와 동일
        document.write('arr의 타입 ',typeof(arr), ' 값 : ',arr, '<br>')
        document.write('arr 방의 개수 ',arr.length,'<br>')
        document.write(6 + ' : ' + arr[6] + '<br>')
        var deleteValue = arr.pop(); // arr 마지막 인덱스 값을 return 하고 배열에서 삭제
        var deleteValue = arr.pop();
        var deleteValue = arr.pop();
        document.write('arr에서 pop 3번 후의 값 ' + arr + '<br>');
        
        for(var i=0;i<arr.length;i++){
            document.writeln(i +' : ' + arr[i]+'<br>');
        }

    </script>
</head>

</body>
</html>
