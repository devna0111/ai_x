    <script>
        document.write('<table>');
        document.write('<tr>')
        for(let i = 2;i<10;i++){
            document.write('<td colspan="2" class = "name">',i,'단</td>')
        }
        document.write('</tr>')
        for(i=1;i<10;i++){
            document.write('<tr>')
            for(j=2;j<10;j++){
                document.write('<td>',j, ' x ', i, ' = ','</td>','<td class="value">',i*j, '</td>')
    }
    document.write('</tr>')
}
        document.write('</table>')
    </script>
