<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>prototype</title>
    <script>
        // 생성자 함수
        function Student(name, kor, mat, eng, sci){ // 실무에서 생성자함수의 첫 문자는 대문자
            this.name = name;
            this.kor= kor;
            this.mat = mat;
            this.eng = eng;
            this.sci = sci;
        }; // 생성자함수는 최종으로 return하는 값이 존재하지 않음.
        // Stuedent 타입의 함수를 prototype에 작성
        Student.prototype.getSum = function(){
            return this.kor + this.eng + this.mat + this.sci;
        };
        Student.prototype.getAvg = function(){
            return this.getSum()/4
        };
        Student.prototype.toString = function(){let output = '';
            for(let key in this){
                if(key!='toString' && key!= 'getSum' && key!='getAvg'){
                    output += key + ' : ' + this[key] + ' ' ;
                }else if(key == 'getSum'){
                    output += key.substring(3).toLowerCase() +' : '+ this[key]() + ' ';
                }else if(key == 'getAvg'){
                    output += key.substring(3).toLowerCase() + ' : ' + this[key]() + '\n';
                }//if
            }; // for문
            return output;};//toString 끝

        students = [
            new Student('홍',11,99,55,88), // new : 생성자함수를 호출하는 키워드
            new Student('김',99,22,99,44),
            new Student('박',66,99,33,77),
        ]
        students.forEach((data, idx)=>document.write(idx + '.' + data + '<br>'));
    </script>
</head>
<body>
    
</body>
</html>
