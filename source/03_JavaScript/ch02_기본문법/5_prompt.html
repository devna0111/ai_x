<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>prompt</title>
    <style>
        
    </style>
    <script>
        let scoreStr = prompt('점수를 입력하세요', '기본값'); // 취소 : null(object) 확인 : 입력값(string)
        // document.writeln('scoreStr : ', scoreStr , ' - 타입 : ',typeof(scoreStr));
        if (scoreStr != null){ // if(!scoreStr) 로 대체 가능
            // string을 number로 형변환1. Number() : 형변환이 불가하면 NaN/ ''나 ' '일 경우 0
            let score = Number(scoreStr); 
            // string을 number로 형변환2. parseInt() : 형변환 불가일 경우 NaN / ''나 ' '일 경우 NaN
            score = parseFloat(scoreStr); 
            //document.writeln('score : ',score,' 타입 : ',typeof(score))
            if(isNaN(score)){ // score가 NaN인지 여부
                alert('점수를 입력하라니까요')
            }else{
                // if(score>=90){
                //     result = '참 잘했어요';
                // }else{
                //     result = '분발하세요';
                // }
                result = (score >= 90) ? '참 잘했어요' : '분발하세요' ;
                document.writeln(result);
            }
        }else{
            alert('점수를 입력하시라니까')
        }
    </script>
</head>
<body>
    
</body>
</html>
