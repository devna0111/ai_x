<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Array내장함수</title>
    <script>
        var arr1 = new Array('hig', 'abc', 'zzz', 'aaa'); // ['hig', 'abc', 'zzz', 'aaa']
        var arr2 = [52, 100, 12, 94];
        let arr1copy = arr1.slice(0); // slice 결과물을 깊은 복사
        arr1copy = Array.from(arr1); // 깊은 복사
        arr1copy = [...arr1]; // 깊은 복사
        document.writeln('정렬 전 arr1 : ' + arr1 + '<br>');
        arr1.sort(); // 문자를 ascii코드 순으로 정렬
        document.writeln('정렬 후 arr1 : ' + arr1 + '<br>');
        document.writeln('정렬 전 arr2 : ' + arr2 + '<br>');
        arr2.sort(); // 수의 크기로 정렬하는 게 아니라 문자 형태로 변환 후  ascii코드 순으로 정렬
        document.writeln('ASCII 코드 정렬 후 arr2 : ' + arr2 + '<br>'); 
        arr2.sort((left, right)=>{
            // return left-right; // 오름차순 정렬 : left - right < 0 : 유지 left-right > 0 : 자리 바꾸기
            return right - left ; // 내림차순 정렬
        });
        document.writeln('내림차순 정렬 후 arr2 : ' + arr2 + '<br>'); 
        arr2.reverse(); // 배열 요소 순서를 뒤집음
        document.writeln('reverse 정렬 후 arr2 : ' + arr2 + '<br>'); 
        // 값이 큰 top3만 출력
        arr2.sort((left, right) => right - left);
        document.writeln('top 3 : ' + arr2.slice(0,3));
    </script>
</head>
<body>
    
</body>
</html>
