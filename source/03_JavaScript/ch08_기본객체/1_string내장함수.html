<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <script>
        var str = 'Abc@Abcd@'; // ['A', 'b','c', '@', 'A', 'b','c','d','@']
        document.write('원본 : ' + str +'<br>');
        document.write('글자길이 : ' + str.length +'<br>');
        document.write('첫번째 글자 : ' + str[0] +'<br>');
        document.write('글자 연결 : ' + str.concat(str) +'<br>');
        // str.substring(a, b) : a번째부터 b번째 앞까지 추출, b 생략 시 끝까지 추출
        // str.substr(a, b) : a번째 부터 b글자수 개 추출
        document.write('3번째 idx 글자부터  8번 idx 앞까지: ' + str.substring(3,8) +'<br>');
        document.write('3번째 idx 글자부터 끝까지 : ' + str.substring(3) +'<br>');
        document.write('5번째 idx 글자부터 3개까지만 : ' + str.substr(5,3) +'<br>'); // substring(5, (5+3))
        document.write('맨 처음 나오는 @의 위치 : ' + str.indexOf('@') +'<br>');
        document.write('맨 마지막 나오는 @의 위치 : ' + str.lastIndexOf('@') +'<br>');
        document.write('양쪽 space 없애기 : ' + "  my app  ".trim() + '<br>'); // 파이썬 strip과 동일하며 좌우 스페이스 전부 없앰
        document.write('대문자로 전환하기 : ' + str.toUpperCase() + '<br>'); // 파이썬 strip과 동일하며 좌우 스페이스 전부 없앰
        document.write('소문자로 전환하기 : ' + str.toLowerCase() + '<br>'); // 파이썬 strip과 동일하며 좌우 스페이스 전부 없앰
        document.write('@를 -로 한 번 바꾸기 : ' + str.replace('@',' - ') + '<br>');
        document.write('@를 -로 모두 바꾸기 : ' + str.replaceAll('@',' - ') + '<br>');
        document.write('@ 없애기 : ' + str.replaceAll('@','') + '<br>');
        document.write('원본 : ' + str +'<br>');
    </script>
</head>
<body>
    
</body>
</html>
