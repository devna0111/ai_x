<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>정규표현식</title>
    <script>
        var str = 'abcd@ef';
        // 패턴
        var patternNum = /[0-9]/; /* /정규표현식/ : 정규표현식 리터럴 */
        var patternENG = /[a-zA-Z]/;
        var patternKOR = /[ㄱ-ㅎㅏ-ㅣ가-힣]/ ;
        var patternSpc = /[~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.]/; // 특수문자 정규표현식 \W에서 space 빼기
        // 정규표현식.test(str) : str에 정규표현식 패턴이 포함되었는지 여부(true/false)
        document.write('str 숫자 포함? ' + patternNum.test(str) + '<br>');
        document.write('str 영문자 포함? ' + patternENG.test(str) + '<br>');
        document.write('str 특수문자 포함? ' + patternSpc.test(str) + '<br>');
        document.write('str 한글 포함? ' + patternKOR.test(str) + '<br>');
        // 주민등록번호 00~99 1 1~2 01~31
        // str.match(정규표현식) : str이 정규표현식과 일치하면 : 정규표현식과 일치하는 문자를 return // 일치하는 문자 없으면 null
        var tel1 = '010-9999-9999';
        var tel2 = '019-9999-9';
        var patternTEL = /^[0-9]{2,3}-[0-9]{3,4}-([0-9]{2}){2}$/;
        document.write('tel1 : ' + tel1.match(patternTEL) + '<br>');
        document.write('tel2 : ' + tel2.match(patternTEL) + '<br>');
        if(tel1.match(patternTEL)){
            document.write('tel1 은 전화번호 형식입니다.<br>')
        } else{
            document.write('tel1은 전화번호 형식이 아닙니다.<br>')
        };
        if(tel2.match(patternTEL)){
            document.write('tel2 은 전화번호 형식입니다.<br>')
        } else{
            document.write('tel2은 전화번호 형식이 아닙니다.<br>')
        };
        // quiz 힌트
        if(!tel2.match(patternTEL)){
            alert('올바른 전화번호 형식이 아닙니다.');
            // return false
        };
        // if(!patternNum.test(frm.pw.value)){
        //     alert('비밀번호에는 숫자, 소문자, 대문자, 특수문자를 포함하세요');
        //     return false;
        // }
    </script>
</head>

</body>
</html>
