<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>window객체속성과 메소드</title>
    <style>    
    </style>
    <script>
        function chk(){};
        window.onclick = function(){
            alert('클릭');
        };
        var cnt = 0 ;
        for(var key in window){ // 내장함수는 어떻게 만들어졌는 지 볼 수가 없다 : native code
            if(key.substr(0,2)=='on' || key == 'chk' || key=='cnt'){
            document.writeln(++cnt +'. ' + key + ' : ' + window[key] + '<br>');
            };
        };
    </script>
</head>

</body>
</html>
