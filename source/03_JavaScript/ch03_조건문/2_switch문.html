    <title>switch</title>
    <style>
        
    </style>
    <script>
        var su = parseInt(prompt('정수를 입력하세요', '0'));
        switch(su%2){
            case 0 : document.write('짝수'); break;
            case 1 : document.write('홀수'); break;
            case -1 :document.write('홀수'); break;
            default : document.write('수를 입력하세요'); // break를 하지 않으면 해당 케이스부터 모든 케이스를 출력해버린다
        }
