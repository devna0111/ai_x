<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>객체의속성과메소드</title>
    <script>
        let name = '이순신';
        let method = function(i){alert(i);};
        let person = {
            name : '이순신', 
            age : 20, 
            eat : function(food){ // 메소드 내에서 파이썬 self는 this로 대신 하며 this, food 식으로 기입할 필요가 없음.화살표함수 불가.
                var msg = this.age + '살 ' + this.name +'님이 '+ food +'를 먹는다' ;
                alert(msg);
            } // eat 함수
        } // 객체 속에 변수형 함수를 부여 가능. person 객체
        document.write(person.name + '님 ' + person.age + '<br>');
        document.write(person + '<br>');
        document.write(person.toString() + '<br>'); // 파이썬에서 __str__() => JS에서 toString()
        person.eat('불고기')
    </script>
</head>
<body>
    
</body>
</html>
