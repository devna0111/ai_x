<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>ajax_get</title>
    <style></style>
    <script src='https://code.jquery.com/jquery-3.7.1.min.js'></script>
    <script>
    $(document).ready(function(){
    //$(CSS선택자).함수();
    /* ajax 함수 : fetch(), $.get(), $.post(), $.ajax() ajax는 json, html 받을 수 있음. 나머지는 html만(부속명령어가 더 있어야 나머지 가능)
    $.get(요청경로(xx?id=aa), callback(data, status){
        2개의 필수 인자.
        data : 요청경로를 수행한 "결과"
        status : success / fail 반환
    });
    $.post(요청경로(xxx), 요청파라미터값의 객체({id:'aa'}), callback(data, status));
    */
        $('button').click(()=>{
            let id = $('input[name="id"]').val();
            // "exists.html?id=입력한id" 를 요청하여 결과(.html)를 span 태그 속 에 
            // $.get('exists.html?id=' + id,function(data, status){
            //     if(status=='success'){
            //         $('span').html(data.trim());
            //     }//if
            // })//get
        });//click
        $('input[name="id"]').keyup(function(){
            var id = $(this).val();
            if(id.length<3){
                $('span#idConfirm').html('ID는 3글자 이상');
            }else{
                //입력된 ID글자가 3글자 이상에서 AJAX
                $.get('nonExists.html?id='+id,function(data){
                    $('span').html(data);
                    })//$.get
            }//if
        });//keyup 이벤트
    });//ready
    </script>
</head>
<body>
    아이디 <input type="text" name="id" autocomplete="off"> <button>중복체크</button><br>
    <span id="idConfirm"></span>
</body>
</html>
