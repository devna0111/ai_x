<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>ajax_ajax</title>
    <style></style>
    <script src='https://code.jquery.com/jquery-3.7.1.min.js'></script>
    <script>
    $(document).ready(function(){
    //$(CSS선택자).함수();
    /* ajax 함수 : fetch(), $.get(), $.post(), $.ajax() ajax는 json, html 받을 수 있음. 나머지는 html만(부속명령어가 더 있어야 나머지 가능)
    $.get(요청경로(xx?id=aa), callback(data, status){
        2개의 필수 인자.
        data : 요청경로를 수행한 "결과"
        status : success / fail 반환
    });
    $.post(요청경로(xxx), 요청파라미터값의 객체({id:'aa'}), callback(data, status));
    $.ajax({
    $.ajax({
    url:'요청경로(xx?id=aa / xx)', // ★★★필수기입
    type: 'get'이나 'post'이나 없거나,
    data: 요청파라미터와 값 'id=aaa'이나 {id:'aaa'},
    dataType : 'html'이나 'json' 요청한 경로로 실행한 결과의 타입,
    success : 요청경로 성공 시 수행할 콜백함수, // ★★★필수기입
    error : 요청경로 실패 시 수행할 콜백함수,
    })
    */    
        $('button').click(()=>{
            let id = $('input[name="id"]').val();
            $.ajax({
                url:'exists.html',
                type: 'get',
                //data:'id='+id,
                data : {id:id},
                dataType:'html',
                success:function(data){
                    $('span#idConfirm').html(data);
                },
                error:function(code){alert(code.status + '/' + code.statusText)},
            }); // $.ajax()
        });//click 이벤트
    
    $('input[name="id"]').keyup(function(){
        let id = $(this).val();
        $.ajax({
            url:'nonExists.html',
            data:{id:id},
            // type: 'get',
            // dataType:'html',
            success:data => $('span').html(data),
            error:code => alert(code.status +'/'+code.statusText),
        })//$.ajax()
    })//keyup 이벤트

    });//ready

    </script>
</head>
<body>
    아이디 <input type="text" name="id" autocomplete="off"> <button>중복체크</button><br>
    <span id="idConfirm"></span>
</body>
</html>
