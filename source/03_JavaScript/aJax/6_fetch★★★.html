<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style></style>
    <script>
        // window가 load될 때
        // window.addEventListener('load',()=>{});//load
        // html DOM 트리가 완성 될 때
        document.addEventListener('DOMContentLoaded',()=>{
            document.querySelector('button').addEventListener('click',()=>{
                let id = document.querySelector('input[name="id"]').value; //jQuery의 .val() 헷갈리지 않기
                let params = new URLSearchParams({id:id}); // console.log(params) => id=변수id, pw=변수pw 형태로 출력!
                console.log('exists.html?id=' +id);
                console.log(`exists.html?id=${id}`); // f'exists.html?id={id}'와 비슷
                console.log(`exists.html?${params}`); // f'exists.html?id={id}'와 비슷
                // 비동기 처리 함수, 비동기 작업의 결과를 약속하는 함수 => fetch
                fetch(`exists.html?${params}`,{method : 'get'})
                .then(response=>{ // response : 요청결과에 따른 여러 정보를 포함
                    if(! response.ok){; // response.ok : 요청 경로의 응갑이 정상적으로 왔는 지 여부
                        // 요청 경로를 정상적으로 응답받지 않을 경우 예외 객체 발생
                        throw new Error(`${response.status}/${response.statusText}`);
                    }//if문 끝
                    return response.text();
                })
                .then(data=>{
                    document.querySelector('span').innerHTML = data.trim();
                })//data : 전 then의 return값을 받음
                .catch(error => { // error : throw의 error를 받음
                    alert(error.message);
                })
            });//button click이벤트 끝
        });//DOMContentLoaded 끝
    </script>
</head>
<body>
    아이디 <input type="text" name="id"><button>중복체크</button><br>
    <span id="idConfirm"></span>
</body>
</html>
