<!DOCTYPE html>

<html lang="en"  xmlns="http://www.w3.org/1999/xhtml">
<head><!-- head : 설정 정보 -->
    <meta charset="utf-8" />
    <meta />
    <title>첫 예제</title>
    <style> /* 이 페이지의 디자인 영역(CSS/CSS3) */
        body {
            background-color : floralwhite ;  
            font-size : 30pt;
           
        }
    </style>
    <script>/* 동적인 부분 */  
        name = prompt('이름은?', '홍길동'); // 취소 클릭 시 'null' 리턴
        if (name != 'null' && name != ' ') { // 입력 후 확인 버튼을 클릭
            document.write(name + '님 반갑습니다<br>');
        }
    </script>
</head>
<body>
    <!-- body : 웹 문서에 출력될 정보 -->
    안녕하세요<br />
    오늘부터 웹 표준&nbsp;&nbsp;&nbsp;&nbsp;수업 시작 합니다<br>
    Hello, World!<br>
</body>
</html>
