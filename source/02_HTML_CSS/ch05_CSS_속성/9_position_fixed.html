<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>포지션_fixed</title>
    <style>
        *{margin:0;padding:0;}
        div{width:200px;height:200px;opacity:0.7;border:1px solid red;}
        #div1{
            position:absolute; /*기본값 static(블럭형으로 쌓아간다, 좌표X) 절대좌표 absolute*/
            top : 0px; left : 0px; background-color:red; opacity:1;
            z-index:-9; /* 요소가 겹쳐질 경우 z-index가 크면 위로 배치 : 가중치 설정이 가능*/
        }
        #div2 {
            background-color: blue;
            position:fixed; /*고정좌표 최초 좌표 눈에 보이는 위치에서 이동하지 않음*/
            top:100px;left:100px;opacity:1;
            z-index:1;
        }
        #div3{width:300px;height:300px;background-color:green;
              position:absolute;top:350px ; left:350px;
        }
        #div4{background-color:yellow;
              position:absolute; /* 기준점 => 부모의 좌상단 꼭지점*/
              top:50px;left:50px;
        }
    </style>
</head>
<body>
    <div id="div1">div1</div>
    <div id="div2">div2</div>
    <div id="div3">
        div3
        <div id="div4" style="border:1px solid green;">div4</div>
    </div>
    
</body>
</html>
