<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        #visibility > div, #display > div{height:100px;width:100px;background-color:red;}
        /* 안보이게 하기 */
        #visibility div:nth-child(2){visibility:hidden;/*안보이게(공간확보)*/}
        #display div:nth-child(2){display:none;/*안보이게(공간미확보)*/}

        /* 투명도 0(완전투명) <= opacity <=1(완전불투명) */
        #visibility div:nth-child(3){opacity:0.2;/* 배경 설정하듯이 연하게 배경화 */}
        #display div:nth-child(1){opacity:0.7}
        #display div:last-child{opacity:1;}
    </style>
</head>
<body>
    <div id="visibility">
        <div>기본은불투명</div><div>안보이게</div><div>거의투명하게</div>
    </div>
    <div id="display">
        <div>반투명</div><div>안보이게</div><div>불투명</div>
    </div>
</body>
</html>
