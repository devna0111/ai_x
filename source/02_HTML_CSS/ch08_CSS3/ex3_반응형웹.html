<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>반응형 웹</title>
    <style>
        /*** 페이지 초기화 ***/
        *{margin: 0;padding:0;}
        li{list-style:none;}
        a{text-decoration: none;color: black;font-weight: bold;display: block;}

        /*** 공통 ***/
        #wrap{border:1px solid gray;box-sizing: border-box;text-align: justify;}
        #wrap #header{
            height: 100px;line-height: 100px;text-align: center;border:2px solid gray;
            box-sizing: border-box;
        }
        #wrap #nav ul{overflow: left;}
        #wrap #nav ul li {float: left;line-height: 60px;text-align: center;border: 1px solid gray;box-sizing: border-box;}
        #wrap #content{clear: both; padding: 10px;}
        #wrap #footer{text-align: center;background-color: darkgray;line-height: 4em;}

        /*** PC용 ***/
        @media screen and (min-width:1501px){
                #wrap {width:700px;margin : 0 auto;}
                #wrap #nav ul li{width: 20%;}    
        }
        
        /*** tab 용 ***/
        @media screen and (min-width:1001px) and (max-width:1500px){
                #wrap {width:99%;margin:0.5%;background-color: lightgreen;font-size: 1.1em;}
                #wrap #nav ul li{width: 25%;}
                #wrap #nav ul li:nth-child(3){display: none;}
        }

        /*** phone 용 ***/
        @media screen and (max-width:1000px){
                #wrap {width:99%;margin:0.5%;background-color: lightpink;font-size: .9em;}
                #wrap #nav ul li{width: 33.3333333%;}
                #wrap #nav ul li:nth-child(2),#wrap #nav ul li:nth-child(4){display: none;}   
        }

    </style>
    <script>
        
    </script>
</head>
<body>
    <div id="wrap">
        <div id="header"><h1>반응형 웹</h1></div>
        <div id="nav">
            <ul>
                <li><a href="#">munu1</a></li>
                <li><a href="#">munu2</a></li>
                <li><a href="#">munu3</a></li>
                <li><a href="#">munu4</a></li>
                <li><a href="#">munu5</a></li>
            </ul>
        </div>
        <div id="content">
            <h2>안녕하세요, 지금 무슨 생각을 하고 계신가요?</h2>
            <p>오늘 저녁에 고기 구워 먹을 생각 중 입니다.</p>
        </div>
        <div id="footer">홍길동 주식 회사</div>
    </div>
</body>
</html>
