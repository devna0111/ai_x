<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
        <meta charset="utf-8" />
        <title>공간분리태그 div</title>
        <style>
                li, div, span {
                        border:1px solid red;
                }
                p {
                        background-color : #dffb9a ;
                }
        </style>
</head>
<body>
        <p> 블록형태그</p>
        <ul><li>item1</li><li>item2</li><li>item3</li></ul>
        <div>block1</div><div>block2</div><div>block3</div>

        <p> 인라인형태그</p>
        <span>inline_tag_01</span><span>inline_tag_02</span>
        <span>inline_tag_03</span><span>inline_tag_04</span> <!-- enter치면 인라인형 공간 발생함-->

</body>
</html>
