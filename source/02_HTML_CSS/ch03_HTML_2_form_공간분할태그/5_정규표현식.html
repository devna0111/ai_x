<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
      <!-- 정규표현식
            ? 0,1회 반복
            + 1회 이상 반복
            * 0회 이상 반복
            . : \n을 제외한 문자
            \. : .
            | 또는
            {2,} 2회 이상 반복
            {m,n} m회 이상 n회 이하 반복
            {n} n회 반복
            \d, [0-9] 숫자
            \D 숫자가 아닌 것
            \w [a-zA-Z0-9] 영문자나 숫자
            \W [a-zA-Z0-9] 영문자나 숫자 가 모두 아닌것
            가-힣 한글
            [~'!@#$%^&*()\-\\_+=[];'{}""''.,/] 특수문자
            전화번호 : \d{2,3}-\d{3,4}-\d{4}
            메일 : \w{1,}@\w{1,}\(.\w{1,}){1,2}
      -->
      <form>
            <fieldset>
                  <legend>필수입력</legend>
                  <ul>
                        <li>
                              <label for="tel">연락처</label> : <input type="tel" name='tel' id="tel"
                                                                    required="required" placeholder="000-0000-0000/xx-xxx-xxxx"
                                                                    pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}"
                                                                    title="전화번호 형식은 000-0000-0000"
                                                                    autofocus="autofocus"/>
                        </li>
                        <li><label for="email">이메일</label> : <input type="email" name='email' id="email"
                                                                    pattern="[a-zA-Z0-9]{1,}@[a-zA-Z0-9]{1,}\.[a-zA-Z0-9]{1,}\.{0,1}[a-zA-Z0-9]{1,}"
                                                                    title="email 형식 안배웠니?"/>
            
                        </li>
                  </ul>
                  <p>
                        <center><input type="submit" value="입력완료" /> <input type="reset" value="입력취소" /></center>
                  </p>
            </fieldset>
      </form>
</body>
</html>
