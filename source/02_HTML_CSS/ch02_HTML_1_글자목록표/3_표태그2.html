<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>표 태그2</title>
    <style>
        table {
            background-color: red;
        }

        tr {
            background-color: yellow;
        }

            tr:hover {
                background-color: lightgreen;
            }

        caption {
            background-color: lightyellow;
        }

    </style>
</head>
<body>
    <table border="1">
        <caption>table ex1</caption>
        <tr>
            <th>국어</th><th>영어</th><th>수학</th>
        </tr>
        <tr>
            <td>100</td><td>60</td><td>80</td>
        </tr>
    </table>

        <table border="1">
        <caption>table ex2</caption>
        <tr>
            <th>국어</th><th>영어</th><th>수학</th>
        </tr>
        <tr>
            <td>100</td><td>60</td><td>80</td>
        </tr>
        <tr>
            <th colspan="2">평균</th><td>80</td>
        </tr>
    </table>
        <table border="1">
            <caption>table ex3</caption>
            <tr>
                <td rowspan="3"><b>중간고사 성적</b></td>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
            </tr>
            <tr>
                <td>100</td>
                <td>60</td>
                <td>80</td>
            </tr>
            <tr>
                <th colspan="2">평균</th>
                <td>80</td>
            </tr>
        </table>
</body>
</html>
