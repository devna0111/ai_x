<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>목록태그</title>
</head>
<body>
    <p>순서가 있는 목록 태그(ordered list ; 1,2,3,.. i,ii,iii,....)</p>
    <ol type="A"> <!-- type : 1(기본값), a, A, i, I.... 가능-->
        <li>python</li>
        <li>웹표준</li>
        <li>웹크롤링</li> <!-- 자동으로 개행을 하는 블록형 태그 -->
    </ol>
    <p>순서가 없는 목록태그(unordered list)</p>  <!-- 순서가 없다는 표현보다는 우선순위가 없는 리스트를 만드는 용도 -->
    <ul type="circle"> <!-- type : disc(기본값), circle, square -->
        <li>python</li>
        <li>웹표준</li>
        <li>웹크롤링</li> 
    </ul>
</body>
</html>
