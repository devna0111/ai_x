<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>상태선택자</title>
        <style>
                input:focus{
                        background-color:aquamarine;
                }
                input:enabled{
                        color : forestgreen;
                }
                input:disabled{
                        font-size:0.5em;
                }
                input:read-only{
                        color:red;
                }
        </style>
</head>
<body>
        <form>
                이름 <input type="text" name="name" /><br />
                아뒤 <input type="text" name="id" /><br />
                비번 <input type="password" name="pw" /><br />
                시급 <input type="number" name="sal" value="100000" disabled="disabled" /><br />
                생일 <input type="text" name="birth" value="951212" readonly="readonly" /><br />
                <input type="submit" value="인풋" />
        </form>
</body>
</html>
