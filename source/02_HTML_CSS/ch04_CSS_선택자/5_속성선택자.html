<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>속성선택자</title>
        <style>
                input{color:green; font-weight:bold; /* 글자색 */}
                input[type='password'] {/* input 중 type이 password인 것만 속성을 부여*/
                        color:red;
                }
                input[type^='te'] { /* input 중 type이 te로 시작하는 속성 */
                        width : 100px;
                }
                input[name$='me'] { /* input 중 name속성이 me로 끝나는 속성 */
                        border : 1px solid red;
                        outline : 0 ;
                        padding : 10px;
                }
                img[alt] {/* img 태그 중에서 alt속성이 있는 */
                          width:50px;
                          border : 1.5px dashed red;
                }
        </style>
</head>
<body>
        <form id="'frm'">
                이름<input type="text" name="name" /><br />
                아뒤<input type="text" name="id" /><br />
                비번<input type="password" name="pw" /><br />
                전화<input type="tel" name="telme" /><br />
                <img src="ch04/logo.png" />
                <img src="ch04/logo.png" alt="고용노동부" /><br />
                <input type="submit" />
        </form>
</body>
</html>
