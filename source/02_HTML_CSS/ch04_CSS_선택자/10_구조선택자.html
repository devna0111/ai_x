<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>구조선택자</title>
        <style>
                *{margin:0; padding :0;}
                div#nav {
                        width: 120px;
                        margin: 10px auto;
                }
                div#nav ul li {
                        list-style:none;     
                        text-align:center;
                        padding : 8px 6px 4px 6px;
                        font-size : 14px;
                        font-weight:bold;
                        margin: 2.5px;
                        border : 1px solid #D6CEC0 ;
                }
                div#nav ul li a{ /* a 태그에 의해 생기는 밑줄 없애기, 글씨 색상*/
                        text-decoration : none;
                        color : black;
                }
                #nav ul li:nth-child(2n+1) { /* ul 밑 li 중 홀수번째, 첫번째가 1*/
                        background-color: #FFA500;
                }
                div#nav ul li:nth-child(2n){ /* ul 밑 li 중 짝수번째*/
                        background-color:#FFFF00;
                }
                #nav ul li:first-child {
                        border-radius : 10px 10px 0px 0px ; /* 좌상 우상 좌하 우하 방향으로 지정*/
                }
                #nav ul li:last-child{
                        border-radius : 0 0 10px 10px ;
                }
        </style>
</head>
<body>
        <div id="nav">
                <ul>
                        <li class="odd"><a href="#menu1">menu1</a></li>
                        <li class="even"><a href="#menu2">menu2</a></li>
                        <li class="odd"><a href="#menu3">menu3</a></li>
                        <li class="even"><a href="#menu4">menu4</a></li>
                        <li class="odd"><a href="#menu5">menu5</a></li>
                        <li class="even"><a href="#menu6">menu6</a></li>
                        <li class="odd"><a href="#menu7">menu7</a></li>
                        <li class="even"><a href="#menu8">menu8</a></li>
                </ul>
        </div>
</body>
</html>
