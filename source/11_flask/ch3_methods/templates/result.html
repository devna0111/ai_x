<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Welcome</title>
    <style>
        body {background-color: #37373796; color : whitesmoke}
    </style>
    <link href="{{url_for('static', filename='flask.png')}}" rel="icon">
    <link href="{{url_for('static', filename='file.css')}}" rel="stylesheet" type="text/css">
</head>
<body>
    <h1>{{member.name}}님, {{member.id}}로 회원가입 완료입니다. {{member.addr}}의 정보를 잘 찾아볼게요!</h1>
    <h2>ID : {{member.id}}</h2>
    <h2>PW : {{member.pw | mask_pw}}</h2>
    <h2>주소: {{member.addr}}</h2>
    <form action="/Welcome", method="get">
        <p><input type="hidden" name = "name" value="{{member.name}}"></p>
        <p><input type="number" name = "value" placeholder="value값" value="{{member.name}}"></p>
        <p><input type="submit" value='전송'></p>
    </form>
</body>
</html>
