    <h1>구구단을 외자</h1>
    <h2>원하는 구구단을 입력하세요.</h2>
    <form action="/" method="post">
        <input type="number" name="numb" placeholder="원하는 구구단을 입력하세요." required=true value="{%if numb%}{{numb}}{%endif%}">
        <input type="submit" value="구구단 확인하기">
    </form>
    {# 주석테스트 #}
    {% if numb %}
        {%for i in range(1,10)%}
            {{numb}} X {{i}} = {{numb*i}} <br>
        {%endfor%}
        </form>
    {%else%}
        <h2> 아직 구구단 수 입력 전 </h2>
    {%endif%}
